# GitHub Actions — 保活 + 定时任务模板
# 免费档：私有仓约 2000 分钟/月，公开仓标准 Runner 不限分钟，并发 20
# 放进仓库 .github/workflows/keepalive.yml
# Secrets：SUPABASE_URL, SUPABASE_ANON_KEY（保活 Supabase，避免 1 周闲置暂停）
name: keepalive

on:
  schedule:
    - cron: "0 3 * * 1,4"  # 每周一、四 03:00 UTC，各跑一次
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health
        run: |
          curl -fsS "${SUPABASE_URL}/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || exit 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
